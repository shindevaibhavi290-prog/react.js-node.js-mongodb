apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-deploy

spec:
  replicas: 3

  selector:
    matchLabels:
      app: react

  template:
    metadata:
      labels:
        app: react

    spec:
      containers:
        - name: react
          image: shindevaibhavi11/mern-frontend:v1

          ports:
            - containerPort: 80
